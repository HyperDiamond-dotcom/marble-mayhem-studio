name: Original 3D Gauntlet preview
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and encoder
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender ffmpeg libegl1
      - name: Render original 3D spiral race
        env:
          MARBLE_OUT: result
        run: |
          mkdir -p result
          blender -b -t 4 -noaudio -P gauntlet_original.py -- --preview
          test -s result/f_0001.png
          test -s result/f_0048.png
          test "$(sha256sum result/f_0001.png | cut -d' ' -f1)" != "$(sha256sum result/f_0048.png | cut -d' ' -f1)"
      - name: Export moving MP4
        run: |
          ffmpeg -y -loglevel error -framerate 12 -i result/f_%04d.png -vf "pad=ceil(iw/2)*2:ceil(ih/2)*2,hqdn3d=2:2:3:3" -c:v libx264 -pix_fmt yuv420p -crf 19 -movflags +faststart result/gauntlet-original-3d-preview.mp4
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 result/gauntlet-original-3d-preview.mp4
          test -s result/gauntlet-original-3d-preview.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: original-3d-spinning-gauntlet
          path: |
            result/gauntlet-original-3d-preview.mp4
            result/f_0024.png
          retention-days: 5
